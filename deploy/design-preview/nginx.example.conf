# 合入平台主域已有配置；无需新增动态子域或证书。map 放在 http 块中。
map $http_upgrade $design_connection_upgrade { default upgrade; '' close; }
server {
    listen 443 ssl;
    server_name app.example.com;
    ssl_certificate /run/tls/platform/fullchain.pem;
    ssl_certificate_key /run/tls/platform/privkey.pem;
    # 其余平台路由沿用已有配置。proxy_pass 不带 URI，保留完整子路径。
    # 启用应用的多实例预览配置后，后端可使用普通负载均衡。
    location /design-preview-relay/ {
        proxy_pass http://autowonder-backend:7001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $design_connection_upgrade;
        # 数据 WebSocket 也承载空闲 HMR；不能使用 HTTP 的 30 秒无数据期限。
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location /design-preview/ {
        proxy_pass http://autowonder-backend:7001;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $design_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
# 仅为配置示例；本任务不部署入口、证书或对外转发。
